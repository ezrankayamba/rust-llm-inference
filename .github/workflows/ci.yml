name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  # Most of the test jobs' time is compiling our own crates, which the cache doesn't keep, so build
  # quickly at the same opt-level instead of with the shipped profile's LTO and single codegen unit.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The only build of the CUDA backend: nothing here can run it, but it must keep compiling.
      - run: cargo clippy --workspace --all-targets --locked --features rli-models/cuda -- -D warnings

  test-linux-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      # This is the only run of the AVX2 kernels; without these features they'd fall back unnoticed.
      - run: grep -q avx2 /proc/cpuinfo && grep -q fma /proc/cpuinfo && grep -q f16c /proc/cpuinfo
      # The AVX-512 block kernel runs only where the runner has it; say so when it doesn't.
      - run: grep -q avx512_vnni /proc/cpuinfo || echo "::warning::no AVX-512 VNNI on this runner, so its block kernel was not tested"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The only build of the CUDA backend: nothing here can run it, but it must keep compiling.
      - run: cargo clippy --workspace --all-targets --locked --features rli-models/cuda -- -D warnings

  test-linux-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      # This is the only run of the AVX2 `dot`; without these features it would fall back unnoticed.
      - run: grep -q avx2 /proc/cpuinfo && grep -q fma /proc/cpuinfo
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked

  test-macos-arm:
    runs-on: macos-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Metal only compiles on macOS, so only this job lints it. CPU-only checks the feature gates.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --workspace --release --locked

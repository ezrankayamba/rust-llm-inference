name: Benchmark

# Manual only: it builds llama.cpp and downloads models, which CI's time limit has no room for.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Compare this engine at HEAD with this revision, instead of with llama.cpp
        default: ""
      threads:
        description: Comma-separated thread counts
        default: "1"
      llama_ref:
        description: llama.cpp tag to compare with
        default: v0.9.0
      models:
        description: Space-separated GGUF URLs
        default: >-
          https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf

permissions:
  contents: read

jobs:
  revisions:
    if: inputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ inputs.base }}
      THREADS: ${{ inputs.threads }}
      MODELS: ${{ inputs.models }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - name: Build both revisions
        run: |
          # A branch name exists here only as origin/<name>.
          rev=$(git rev-parse -q --verify "$BASE^{commit}" || git rev-parse --verify "origin/$BASE^{commit}")
          git worktree add -q --detach "$RUNNER_TEMP/base" "$rev"
          for dir in . "$RUNNER_TEMP/base"; do
            (cd "$dir" && cargo build --release --locked -p rli-models --example bench \
              && cargo build --release --locked -p rli-core --example bench_matvec)
          done
      - name: Compare
        run: |
          lscpu | grep 'Model name'
          run() { # label, target dir
            for t in ${THREADS//,/ }; do
              echo "== $1, kernels, $t threads"
              RAYON_NUM_THREADS=$t "$2/examples/bench_matvec" | grep -E '^ *Q'
              for model in "$RUNNER_TEMP"/*.gguf; do
                echo "== $1, $(basename "$model"), $t threads"
                "$2/examples/bench" "$model" --pp 256 --tg 64 --threads "$t" | grep -E '^(pp|tg)'
              done
            done
          }
          for url in $MODELS; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$(basename "$url")" "$url"
          done
          # Twice, alternating, to expose drift on the shared runner.
          for i in 1 2; do
            run base "$RUNNER_TEMP/base/target/release"
            run head target/release
          done

  compare:
    if: inputs.base == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      THREADS: ${{ inputs.threads }}
      LLAMA_REF: ${{ inputs.llama_ref }}
      MODELS: ${{ inputs.models }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # The shipped release profile, unlike CI's quick test builds: this measures what users run.
      - run: |
          cargo build --release --locked -p rli
          cargo build --release --locked -p rli-models --example bench
      # Both builds in this job, since runner CPUs vary: native is what a user would build there, and
      # AVX2-only shows how much of the difference is instructions our kernels don't use.
      - name: Build llama.cpp
        run: |
          git clone -q --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          common="-DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF"
          cmake -B native $common -DGGML_NATIVE=ON
          cmake -B avx2 $common -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_BMI2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          for b in native avx2; do
            cmake --build "$b" -j "$(nproc)" --target llama-bench llama-completion
          done
      - name: Compare
        run: |
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512f|avx512_vnni|avx_vnni|amx_int8)$' | paste -sd' '
          for url in $MODELS; do
            model="$RUNNER_TEMP/$(basename "$url")"
            curl -fsSL --retry 3 -o "$model" "$url"
            for b in native avx2; do
              echo "llama.cpp build: $b" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 scripts/bench_compare.py --bin-dir target/release \
                --llama-dir "$RUNNER_TEMP/llama.cpp/$b/bin" --model "$model" --threads "$THREADS" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              # The instructions the build really used, in case a flag above was ignored.
              "$RUNNER_TEMP/llama.cpp/$b/bin/llama-completion" -m "$model" -p hi -n 1 -ngl 0 2>&1 \
                | grep -m1 'system_info' || true
            done
            rm "$model"
          done

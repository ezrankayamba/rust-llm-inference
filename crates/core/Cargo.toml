[package]
name = "rli-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
# CUDA driver + NVRTC bindings, loaded at runtime so the build needs no CUDA toolkit.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }

[features]
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
cuda = ["dep:cudarc"]

# Metal is only reachable through Objective-C; objc2 is the maintained binding.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

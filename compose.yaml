# One model behind the OpenAI-compatible API on :8080.
#   MODEL_DIR=./models RLI_MODEL=/models/Qwen3-4B-Q4_K_M.gguf docker compose up -d
# With RLI_MODEL_URL set, a missing model is downloaded into MODEL_DIR (writable by uid 10001).
services:
  rli:
    image: ${RLI_IMAGE:-ezrankayamba/rli-server:latest}
    ports:
      - "${RLI_PUBLISH_PORT:-8080}:8080"
    volumes:
      - ${MODEL_DIR:-./models}:/models
    environment:
      RLI_MODEL: ${RLI_MODEL:-/models/model.gguf}
      RLI_MODEL_URL: ${RLI_MODEL_URL:-}
      RLI_MODEL_SHA256: ${RLI_MODEL_SHA256:-}
      HF_TOKEN: ${HF_TOKEN:-}
      RLI_CTX: ${RLI_CTX:-}
      RLI_THREADS: ${RLI_THREADS:-}
      RLI_EXTRA_ARGS: ${RLI_EXTRA_ARGS:-}
    restart: unless-stopped

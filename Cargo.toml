[workspace]
resolver = "3"
members = ["crates/core", "crates/gguf", "crates/models", "crates/cli", "crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rli-core = { path = "crates/core" }
rli-gguf = { path = "crates/gguf" }
rli-models = { path = "crates/models" }
memmap2 = "0.9"
rayon = "1.12"
serde_json = "1.0"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

# Tests exercise numeric kernels on real-sized buffers; unoptimized builds are needlessly slow.
[profile.test]
opt-level = 2
